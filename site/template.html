<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}} · anyserve.universe</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Inter", "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        --bg: #f6f7f9;
        --surface: #fff;
        --surface-muted: #f9fafb;
        --line: #e4e7eb;
        --text: #1b2430;
        --muted: #667085;
        --accent: #3557d6;
        --accent-soft: #eaf0ff;
        --mono: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 1px 3px rgba(16, 24, 40, 0.06);
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
      .top { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 28px; background: var(--surface); border-bottom: 1px solid var(--line); }
      .mark { width: 10px; height: 10px; margin-right: 4px; border-radius: 3px; background: var(--accent); }
      .brand { margin-right: 18px; font-size: 14px; font-weight: 650; color: var(--text); text-decoration: none; }
      .top nav { display: flex; gap: 4px; }
      .top nav a { padding: 6px 12px; border-radius: 8px; color: var(--muted); font-size: 13px; font-weight: 500; text-decoration: none; }
      .top nav a:hover { color: var(--text); background: var(--surface-muted); }
      .top nav a.is-active { color: var(--accent); background: var(--accent-soft); }
      .top .repo { margin-left: auto; color: var(--muted); font-size: 13px; text-decoration: none; }
      .top .repo:hover { color: var(--text); }
      main { max-width: 880px; margin: 0 auto; padding: 28px 28px 60px; }
      article { padding: 28px 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); font-size: 14.5px; line-height: 1.6; }
      article > :first-child { margin-top: 0; }
      article h1 { font-size: 24px; font-weight: 650; letter-spacing: -0.01em; margin: 0 0 14px; }
      article h2 { font-size: 17px; font-weight: 600; margin: 28px 0 10px; padding-top: 18px; border-top: 1px solid var(--line); }
      article p { margin: 0 0 12px; }
      article a { color: var(--accent); text-decoration: none; }
      article a:hover { text-decoration: underline; }
      article code { font-family: var(--mono); font-size: 0.9em; padding: 1px 5px; border-radius: 5px; background: var(--surface-muted); border: 1px solid var(--line); }
      article pre { margin: 0 0 14px; padding: 12px 14px; overflow: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface-muted); font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
      article pre code { padding: 0; border: 0; background: none; font-size: inherit; }
      article table { width: 100%; border-collapse: collapse; margin: 0 0 14px; font-size: 13.5px; }
      article th, article td { padding: 9px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
      article th { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
      article ul, article ol { padding-left: 22px; margin: 0 0 12px; }
      article li { margin: 4px 0; }
      @media (max-width: 720px) {
        .top { height: auto; flex-wrap: wrap; padding: 12px 16px; }
        .top .repo { margin-left: 0; }
        main { padding: 16px; }
        article { padding: 20px; }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <span class="mark" aria-hidden="true"></span>
      <a class="brand" href="{{prefix}}">anyserve.universe</a>
      <nav>{{nav}}</nav>
      <a class="repo" href="https://github.com/anyserve/anyserve.universe">github.com/anyserve/anyserve.universe</a>
    </header>
    <main>
      <article>{{content}}</article>
    </main>
  </body>
</html>
